services:
  app:
    build: .
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # La base sobrevive a la recreación y a docker compose down.
      - datos:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  datos:
